[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "deeplrn"
version = "0.1.0"
description = "Evidence-linked document NLP for extracting neutral audit findings from Philippine COA reports."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "DEEPLRN Team"},
]

dependencies = [
    "pdfplumber>=0.10.0",
    "python-docx>=1.1.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "transformers>=4.35.0",
    "torch>=2.0.0",
    "tqdm>=4.65.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
deeplrn-preprocess = "deeplrn.cli:main"
deeplrn-prepare = "deeplrn.workflows:prepare_main"
deeplrn-split = "deeplrn.splitting:main"
deeplrn-train = "deeplrn.workflows:train_main"
deeplrn-infer = "deeplrn.workflows:infer_main"
deeplrn-experiments = "deeplrn.experiments:experiments_main"

[tool.setuptools.packages.find]
include = ["deeplrn*"]

[tool.ruff]
line-length = 100
target-version = "py39"
